version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campushinge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusapp
      POSTGRES_PASSWORD: campusapp_dev
      POSTGRES_DB: campusapp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: campushinge_valkey
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:
